<div
  class="viewport-content"
  [class.viewport-content--blocked]="portraitBlocked()"
  [inert]="portraitBlocked()"
>
  <ng-content />
</div>
@if (portraitBlocked()) {
  <section class="rotate-prompt" aria-labelledby="rotate-title" role="status">
    <span class="rotate-prompt__icon" aria-hidden="true">&#8635;</span>
    <h1 id="rotate-title">Rotate your phone</h1>
    <p>TO100 is played in landscape. Turn your device sideways to continue.</p>
    <p>You may need to turn off your device's rotation lock.</p>
  </section>
}
@if (fullscreenAvailable()) {
  <button
    type="button"
    class="fullscreen-toggle"
    [attr.aria-pressed]="fullscreen()"
    [disabled]="requestingFullscreen()"
    (click)="toggleFullscreen()"
  >
    {{ fullscreen() ? 'Exit fullscreen' : 'Fullscreen' }}
  </button>
}
@if (fullscreenNotice()) {
  <p class="fullscreen-notice" role="status">{{ fullscreenNotice() }}</p>
}
