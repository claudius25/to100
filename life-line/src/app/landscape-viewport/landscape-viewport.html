<div
  class="viewport-content"
  [class.viewport-content--blocked]="menu() || portraitBlocked() || !launched()"
  [inert]="menu() || portraitBlocked() || !launched()"
>
  <ng-content />
</div>
@if (menu() || portraitBlocked() || !launched()) {
  <section class="rotate-prompt" aria-label="TO100 launcher">
    <img class="launcher-image" src="assets/launcher.png" alt="TO100" />
    <div class="launcher-actions">
      <app-action-button
        class="fullscreen-toggle"
        [icon]="primaryIcon()"
        [label]="primaryLabel()"
        [disabled]="requestingFullscreen() || busy()"
        (pressed)="play()"
      />
      @if (menu() && hasSavedLife()) {
        <app-action-button
          class="fullscreen-toggle continue-life"
          icon="next"
          label="Continue"
          [disabled]="requestingFullscreen() || busy()"
          (pressed)="play('continue')"
        />
      }
    </div>
    @if (portraitBlocked()) {
      <p class="sr-only" role="status">Rotate your device to landscape to continue.</p>
    }
    @if (saveError()) {
      <p class="save-notice" role="alert">{{ saveError() }}</p>
    }
  </section>
}
@if (fullscreenNotice()) {
  <p class="fullscreen-notice" role="status">{{ fullscreenNotice() }}</p>
}
