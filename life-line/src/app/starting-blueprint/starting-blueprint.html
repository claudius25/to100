<section class="blueprint">
  <app-blueprint-tower
    class="blueprint__tower"
    (blueprintCompleted)="onBlueprintCompleted($event)"
    (restarted)="onRestarted()"
  />

  <header class="blueprint__intro">
    <a class="blueprint__back" routerLink="/">← Life Line</a>
    <small class="blueprint__eyebrow">THE BEGINNING OF YOU</small>
    <h1 class="blueprint__title">Your blueprint.</h1>
    <p class="blueprint__lead">
      Four starting traits. A little chance.<br />A lifetime of possibilities.
    </p>

    @if (result()) {
      <button type="button" class="blueprint__begin" [disabled]="started()" (click)="begin()">
        Begin life →
      </button>
    }
    @if (started()) {
      <p class="blueprint__locked" role="status">Blueprint locked in — ready to begin.</p>
    }
  </header>
</section>
