<button
  type="button"
  class="action-button"
  [disabled]="disabled()"
  [attr.aria-label]="accessibleLabel()"
  (click)="press()"
>
  <svg class="glyph" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
    @switch (icon()) {
      @case ('restart') {
        <path d="M20 12a8 8 0 1 1-2.34-5.66" />
        <path d="M20 3.6V8h-4.4" />
      }
      @case ('play') {
        <path class="solid" d="M9.2 6.1 18 12l-8.8 5.9z" />
      }
      @case ('next') {
        <path d="M4.8 12h13.4" />
        <path d="M12.9 6.4 18.5 12l-5.6 5.6" />
      }
    }
  </svg>
</button>
